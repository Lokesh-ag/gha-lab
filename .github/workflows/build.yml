name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write           # needed to push to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Test with a JUnit report
        working-directory: app
        run: pytest --junitxml=report.xml
      - name: Keep the test report
        if: always()                       # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/report.xml
          
      - name: Show config
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Environment is ${{ vars.APP_ENV }}"
          echo "Secret is $DEMO_SECRET"        # prints *** in the log
          echo "Secret length is ${#DEMO_SECRET}"


  build:
    needs: test                            # only builds when tests pass
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tag
        id: vars
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # ,, = lowercase (registry needs it)
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token, no secret to create

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha                 # reuse layers from earlier runs
          cache-to: type=gha,mode=max

  report:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-report
      - name: Summary
        run: |
          echo "### Built ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Test report size: $(wc -c < report.xml) bytes" >> "$GITHUB_STEP_SUMMARY"

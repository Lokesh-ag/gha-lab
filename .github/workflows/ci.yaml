name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read            # least privilege: this workflow only reads code

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']   # runs the job twice, in parallel
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python }}
      - working-directory: app
        run: pytest -v

